<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NusaRoast Store Locator — PWA Lokasi Toko</title>
  <meta name="description" content="Aplikasi Progressive Web App (PWA) direktori lokasi gerai kopi dan peta interaktif Google Maps." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NusaRoast" />

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    };
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-600 selection:text-white">
  <!-- Header Navigasi Utama -->
  <header class="sticky top-0 z-30 flex items-center justify-between gap-8 border-b border-slate-200 bg-white/95 px-6 py-3.5 backdrop-blur-md">
    <a href="#" class="text-lg font-bold tracking-tight text-slate-900 whitespace-nowrap shrink-0">
      NusaRoast Locator
    </a>
    <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600">
      <a href="#direktori" class="hover:text-slate-900 transition-colors whitespace-nowrap shrink-0">Direktori Gerai</a>
      <a href="#peta" class="hover:text-slate-900 transition-colors whitespace-nowrap shrink-0">Peta Interaktif</a>
      <button id="btn-use-gps" type="button" class="hover:text-emerald-700 transition-colors whitespace-nowrap shrink-0 cursor-pointer">
        Deteksi GPS Saya
      </button>
    </nav>
    <div class="flex items-center gap-3 shrink-0">
      <button id="btn-install-pwa" type="button" class="hidden px-4 py-2 text-xs font-semibold text-white bg-emerald-600 rounded-lg hover:bg-emerald-700 transition-colors whitespace-nowrap shrink-0 cursor-pointer">
        Install Aplikasi
      </button>
    </div>
  </header>

  <!-- Kontainer Utama Split-Screen (Sidebar + Google Maps Embed) -->
  <main class="mx-auto max-w-[1440px] px-4 py-5 sm:px-6 lg:py-6">
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-12 lg:items-start">
      
      <!-- Kolom Kiri: Pencarian, Filter Jarak, dan Daftar Toko (5 Kolom di Desktop) -->
      <section id="direktori" class="flex flex-col rounded-2xl border border-slate-200 bg-white lg:col-span-5 overflow-hidden">
        <div class="border-b border-slate-200 p-4 sm:p-5 space-y-3.5">
          <div class="flex items-center justify-between gap-2">
            <h1 class="text-base font-bold text-slate-900">Daftar Lokasi Gerai</h1>
            <span id="store-count-label" class="text-xs font-mono text-slate-500 tabular-nums">Memuat...</span>
          </div>

          <!-- Input Pencarian -->
          <div class="relative">
            <input
              id="search-input"
              type="search"
              placeholder="Cari nama toko, jalan, atau kota..."
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-900 focus:bg-white focus:outline-none"
            />
          </div>

          <!-- Filter Jarak Interaktif -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between text-xs text-slate-500">
              <span>Filter Jarak dari Titik Anda</span>
              <span id="gps-status-text" class="font-mono tabular-nums text-slate-600">Jakarta Pusat (Default)</span>
            </div>
            <div id="distance-filters" class="grid grid-cols-4 gap-1 rounded-xl bg-slate-100 p-1">
              <button type="button" data-distance="all" class="dist-btn rounded-lg bg-white py-1.5 text-xs font-semibold text-slate-900 shadow-xs transition-colors">Semua</button>
              <button type="button" data-distance="3" class="dist-btn rounded-lg py-1.5 text-xs font-medium text-slate-600 hover:text-slate-900 transition-colors">&le; 3 km</button>
              <button type="button" data-distance="10" class="dist-btn rounded-lg py-1.5 text-xs font-medium text-slate-600 hover:text-slate-900 transition-colors">&le; 10 km</button>
              <button type="button" data-distance="25" class="dist-btn rounded-lg py-1.5 text-xs font-medium text-slate-600 hover:text-slate-900 transition-colors">&le; 25 km</button>
            </div>
          </div>
        </div>

        <!-- Daftar Toko Scrollable -->
        <div id="store-list" class="store-list-scroll divide-y divide-slate-100 max-h-[460px] lg:max-h-[580px] overflow-y-auto">
          <!-- Item toko dirender secara dinamis oleh app.js -->
        </div>
      </section>

      <!-- Kolom Kanan: Google Maps Embed & Panel Detail Toko (7 Kolom di Desktop) -->
      <section id="peta" class="flex flex-col rounded-2xl border border-slate-200 bg-white lg:col-span-7 overflow-hidden">
        <!-- Info Bar Toko Aktif -->
        <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 p-4 sm:p-5">
          <div class="min-w-0 flex-1">
            <p id="active-store-meta" class="text-xs text-slate-500">Pilih toko pada daftar</p>
            <h2 id="active-store-name" class="mt-0.5 text-lg font-bold text-slate-900 truncate">Memuat Peta Lokasi...</h2>
            <p id="active-store-address" class="mt-0.5 text-xs text-slate-600 line-clamp-1"></p>
          </div>
          <div class="flex items-center gap-2.5 shrink-0">
            <a
              id="btn-directions"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-flex min-h-[42px] items-center gap-2 rounded-xl bg-slate-900 px-4 py-2.5 text-xs font-semibold text-white transition-colors hover:bg-slate-800 whitespace-nowrap shrink-0"
            >
              <span>Petunjuk Arah (Directions)</span>
            </a>
          </div>
        </div>

        <!-- Bingkai Google Maps Iframe -->
        <div class="relative w-full bg-slate-100 h-[380px] sm:h-[460px] lg:h-[540px]">
          <iframe
            id="google-map-iframe"
            title="Peta Lokasi Gerai NusaRoast"
            class="map-iframe-frame h-full w-full border-0"
            loading="lazy"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade"
            src="https://maps.google.com/maps?q=-6.1964,106.8306&z=16&output=embed&hl=id"
          ></iframe>
        </div>

        <!-- Baris Metadata Koordinat & Jam Operasional -->
        <div class="flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 bg-slate-50/70 px-5 py-3 text-xs text-slate-600">
          <span id="active-store-hours">Jam Operasional: -</span>
          <span id="active-store-coords" class="font-mono tabular-nums text-slate-500">Koordinat: -</span>
        </div>
      </section>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
